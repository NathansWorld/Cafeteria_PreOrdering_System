spring.application.name=Cafeteria_Ordering_Backend

# CORS allowed origins (defaults to local development, overridable via .env)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174,https://*.trycloudflare.com}

# Cookie Security (false for local HTTP development, true for production HTTPS/Cloudflare)
app.security.cookie.secure=${APP_SECURITY_COOKIE_SECURE:false}

#Cloudflare
server.forward-headers-strategy=framework

#JWT Config
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=900000


# Database Connection (defaults to local MySQL, overridable via .env)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://db:3306/cafeteriadb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Johannesburg}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Order Cleanup (pending items changed to cancelled after x amount of time)
    # How often the scheduler wakes up to check (in milliseconds - 5min currently)
app.scheduler.order-cleanup.delay-ms=300000
    # How old an order must be before it is considered expired (in minutes - 15min currently)
app.orders.expiration-timeout-minutes=15

# Cafeteria Operating Hours
app.cafeteria.opening-time=08:00
app.cafeteria.closing-time=17:30

# File Upload & Image Storage Configuration
app.image-storage.provider=cloudinary
app.upload.dir=${APP_UPLOAD_DIR:../uploads}
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Cloudinary Settings
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:cloud_name}
cloudinary.api-key=${CLOUDINARY_API_KEY:api_key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:api_secret}

# Multipart Upload File Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Application Logging
logging.config=classpath:logback-spring.xml

# Logging levels
logging.level.root=INFO
logging.level.org.example.cafeteria_ordering_backend=INFO

# Log file rotation
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=200MB

# Payfast sandbox URLs and endpoint configs
payfast.merchant-id=${PAYFAST_MERCHANT_ID:10000100}
payfast.merchant-key=${PAYFAST_MERCHANT_KEY:46f0cd6975815}
payfast.passphrase=${PAYFAST_PASSPHRASE:itn_passphrase}

payfast.process-url=https://sandbox.payfast.co.za/eng/process
payfast.return-url=${APP_BASE_URL:http://localhost:8080}/api/payments/payfast/return
payfast.cancel-url=${APP_BASE_URL:http://localhost:8080}/api/payments/payfast/cancel
payfast.itn-url=${APP_BASE_URL:http://localhost:8080}/api/payments/payfast/itn

# PayGate PayWeb3 sandbox
paygate.id=${PAYGATE_ID:10011072130}
paygate.encryption-key=${PAYGATE_ENCRYPTION_KEY:secret}

paygate.initiate-url=https://secure.paygate.co.za/payweb3/initiate.trans
paygate.process-url=https://secure.paygate.co.za/payweb3/process.trans

paygate.return-url=${PAYGATE_BASE_URL:http://localhost:8080}/api/payments/paygate/return
paygate.notify-url=${PAYGATE_BASE_URL:http://localhost:8080}/api/payments/paygate/notify

# Firebase Cloud Messaging Config
firebase.config.path=${FIREBASE_CONFIG_PATH:classpath:firebase-service-account.json}

# Frontend URL
app.frontend.url=${FRONTEND_URL:http://localhost:5173}